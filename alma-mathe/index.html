<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Almas Lernwelt</title>
<meta name="theme-color" content="#ff8a3d">
<style>
:root{
  --bg:#fff7ec; --card:#ffffff; --ink:#2b2340; --muted:#7a7090;
  --pri:#ff8a3d; --pri2:#ffb36b; --ok:#2fb36d; --bad:#e5484d; --blue:#3d7bff; --line:#eadfce;
  --soft:#fff1de;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.7rem;margin:.2em 0}
h2{font-size:1.3rem;margin:.4em 0}
button{font:inherit;cursor:pointer;border:none}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 4px 0 var(--line);margin-bottom:14px}
.btn{background:var(--pri);color:#fff;border-radius:16px;padding:14px 20px;font-size:1.15rem;font-weight:700;box-shadow:0 4px 0 #d96a22}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d96a22}
.btn.sec{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 #2856c4}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.center{text-align:center}
input.txt{width:100%;font:inherit;font-size:1.2rem;padding:12px 14px;border-radius:14px;border:2px solid var(--line);margin:6px 0 12px;background:#fff}
.err{color:var(--bad);font-weight:700;min-height:1.3em}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.stars{background:#fff;border-radius:99px;padding:6px 14px;font-weight:700;box-shadow:0 3px 0 var(--line);white-space:nowrap}
.linkbtn{background:none;color:var(--muted);text-decoration:underline;font-size:1rem;padding:6px}
/* Fächer & Modi */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border-radius:22px;padding:18px 12px;text-align:center;box-shadow:0 5px 0 var(--line);border:3px solid var(--line);color:var(--ink)}
.tile:active{transform:translateY(3px)}
.tile .ic{font-size:2.6rem}
.tile b{display:block;font-size:1.2rem;margin-top:4px}
.tile small{color:var(--muted)}
.tile .bar{margin:8px 10px 0}
/* Themenliste */
.topic{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px 14px;margin-bottom:10px;box-shadow:0 3px 0 var(--line);width:100%;text-align:left;color:var(--ink)}
.topic .ic{font-size:1.7rem;width:2.2rem;text-align:center}
.topic .nm{flex:1;font-weight:700}
.topic .nm small{display:block;font-weight:400;color:var(--muted)}
.topic.next{outline:3px solid var(--pri)}
.badge{font-size:1.4rem}
.bar{height:10px;background:#f1e7d8;border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px}
/* Aufgabe */
.prog{display:flex;gap:5px;margin:4px 0 12px}
.prog span{flex:1;height:10px;border-radius:9px;background:#f1e7d8}
.prog span.ok{background:var(--ok)}.prog span.bad{background:var(--bad)}.prog span.cur{background:var(--pri2)}
.tname{color:var(--muted);font-weight:700;font-size:.95rem}
.q{font-size:1.7rem;font-weight:700;line-height:1.35;margin:10px 0 6px;text-align:center}
.q.small{font-size:1.25rem}
.box{display:inline-block;min-width:2.2em;border-bottom:4px solid var(--pri);color:var(--pri);text-align:center}
.answer{display:flex;justify-content:center;margin:10px 0}
.ansfield{min-width:150px;font-size:2rem;font-weight:700;text-align:center;background:var(--soft);border:3px solid var(--pri2);border-radius:16px;padding:6px 16px;min-height:62px;letter-spacing:2px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:8px auto 0}
.key{background:#fff;border-radius:16px;font-size:1.7rem;font-weight:700;padding:12px 0;box-shadow:0 4px 0 var(--line);border:2px solid var(--line);color:var(--ink)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.key.ok{background:var(--ok);color:#fff;border-color:var(--ok);box-shadow:0 4px 0 #1f8a51}
.key.del{background:#fff3f3}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opts.one{grid-template-columns:1fr}
.opt{background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px 10px;font-size:1.25rem;font-weight:700;color:var(--ink);box-shadow:0 4px 0 var(--line);display:flex;align-items:center;justify-content:center;min-height:64px}
.opt.big{font-size:2.2rem}
.opt.right{background:#e3f7ec;border-color:var(--ok)}
.opt.wrong{background:#fde8e8;border-color:var(--bad)}
.fb{border-radius:18px;padding:14px;margin-top:14px;font-size:1.1rem}
.fb.ok{background:#e3f7ec;border:2px solid var(--ok)}
.fb.bad{background:#fde8e8;border:2px solid var(--bad)}
.fb b.big{font-size:1.35rem}
.fig{display:flex;justify-content:center;margin:8px 0}
.fig svg{max-width:100%;height:auto}
/* antippbare Elemente in Bildern */
.tapme{cursor:pointer}
.tapme .hit{fill:transparent}
.tap-right .ink{fill:var(--ok)!important;stroke:var(--ok)!important}
.tap-wrong .ink{fill:var(--bad)!important;stroke:var(--bad)!important}
.tap-right .ink-s,.tap-right .ink-s *{stroke:var(--ok)!important}
.tap-wrong .ink-s,.tap-wrong .ink-s *{stroke:var(--bad)!important}
/* Mathe: Stellentafel, Hundertertafel */
table.st{border-collapse:collapse;margin:8px auto;font-size:1.5rem}
table.st th,table.st td{border:3px solid #c9b9a2;min-width:70px;height:56px;text-align:center;padding:4px}
table.st th{background:#ffe6c9;font-size:1.25rem}
table.st td.sel{background:#fff1de;outline:3px solid var(--pri);outline-offset:-5px}
table.st td.inp{cursor:pointer;font-weight:700;color:var(--blue)}
table.st td.strokes{height:70px;vertical-align:middle}
.ht{display:grid;grid-template-columns:repeat(3,64px);gap:0;justify-content:center;margin:10px auto}
.ht div{border:2px solid #c9b9a2;height:52px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:700;background:#fff}
.ht div.q{background:#fff1de;color:var(--pri);font-size:1.6rem;margin:0}
.ht div.e{background:#f7f2ea}
svg{max-width:100%}
/* Eltern */
footer{text-align:center;padding:18px 10px 26px}
table.stat{width:100%;border-collapse:collapse;font-size:.98rem}
table.stat th,table.stat td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.stat td.n,table.stat th.n{text-align:right;white-space:nowrap}
.pct{font-weight:700}
.pct.g{color:var(--ok)}.pct.m{color:#d98a00}.pct.b{color:var(--bad)}
details{margin:6px 0}
summary{cursor:pointer;font-weight:700;padding:6px 0}
.sub td{font-size:.9rem;color:#4b4361}
.errlist li{margin-bottom:6px}
.hide{display:none!important}
.done-emoji{font-size:4rem;text-align:center}
@media (max-width:480px){
  .q{font-size:1.45rem}
  table.st th,table.st td{min-width:58px}
  .grid2.modes{grid-template-columns:1fr}
}
</style>
</head>
<body>
<main id="app"></main>
<footer id="foot"></footer>

<!-- ===== Kern: gemeinsame Helfer für alle Fächer ===== -->
<script>
"use strict";
const FAECHER = [];
function registerFach(f){ FAECHER.push(f); }
const r = (a,b)=> a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const BOX = '<span class="box">?</span>';
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dot = " · ";
function uniqOpts(correct, cands, n=4){
  const s = new Set([String(correct)]);
  for(const c of shuffle(cands)){ if(s.size>=n) break; if(c!==undefined && c!==null && String(c)!=="") s.add(String(c)); }
  return shuffle([...s]);
}
</script>

<!-- ===== Fächer: hier neue Fach-Dateien eintragen (Reihenfolge = Reihenfolge auf der Startseite) ===== -->
<script src="faecher/mathe.js"></script>
<script src="faecher/musik.js"></script>

<!-- ===== App ===== -->
<script>
"use strict";
const KEY = "alma-mathe-v1";   // bleibt gleich, damit bisherige Ergebnisse erhalten bleiben
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }
let DB = load();
for(const k of ["stats","sub","progress","days"]) DB[k] = DB[k] || {};
DB.errors = DB.errors || []; DB.stars = DB.stars || 0;

const USER = {name:"alma", pw:"123"};
const PARENT_PW = "1234";
const ROUND = 10, PASS = 8;
let loggedIn = false; try{ loggedIn = localStorage.getItem(KEY+"-login")==="1"; }catch(e){}

const TOPIC = {}, FACH = {}, TOPIC_FACH = {};
for(const f of FAECHER){ FACH[f.id]=f; for(const t of f.topics){ TOPIC[t.id]=t; TOPIC_FACH[t.id]=f.id; } }

function genTask(topicId){
  const t=TOPIC[topicId]; const tot=t.gens.reduce((s,g)=>s+g.w,0); let x=Math.random()*tot;
  let g=t.gens[0]; for(const gg of t.gens){ x-=gg.w; if(x<0){ g=gg; break; } }
  const task=g.f(); task.topic=topicId; task.sub=g.sub; task.subLabel=g.label; return task;
}

/* ===== Statistik ===== */
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function plainQ(task){ let s=task.q.replace(/<br>/g," ").replace(/<[^>]+>/g,"").replace(/&nbsp;/g," ").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&");
  if(task.extra) s+=" [mit Bild]"; return s.trim(); }
function record(task, ok, given){
  const st=DB.stats[task.topic] ||= {n:0,ok:0}; st.n++; if(ok) st.ok++;
  const sb=DB.sub[task.topic+"|"+task.sub] ||= {n:0,ok:0}; sb.n++; if(ok) sb.ok++;
  const d=DB.days[today()] ||= {n:0,ok:0}; d.n++; if(ok) d.ok++;
  if(ok) DB.stars++;
  else { DB.errors.unshift({t:Date.now(), topic:task.topic, sub:task.subLabel, q:plainQ(task), given:String(given), correct:ansText(task,true)}); DB.errors=DB.errors.slice(0,40); }
  save();
}
function ansText(t, plain){
  if(t.showAns!==undefined) return plain? String(t.showAns).replace(/<[^>]+>/g,"") : t.showAns;
  if(t.type==="place") return `H ${t.ans[0]}, Z ${t.ans[1]}, E ${t.ans[2]}`;
  if(t.labels && t.labels[t.ans] && !plain) return t.labels[t.ans];
  return plain? String(t.ans) : esc(t.ans);
}
function topicPct(id){ const s=DB.stats[id]; return s&&s.n? Math.round(100*s.ok/s.n):null; }
function fachDone(f){ return f.topics.filter(t=>DB.progress[t.id]&&DB.progress[t.id].done).length; }
function nextTopic(f){ return f.topics.find(t=>!(DB.progress[t.id]&&DB.progress[t.id].done)) || null; }

/* ===== Ansichten ===== */
const app=document.getElementById("app"), foot=document.getElementById("foot");
let S=null, curFach=null;
function setFoot(show=true){ foot.innerHTML = show? `<button class="linkbtn" onclick="showParentLogin()">👪 Eltern</button>` : ""; }

function showLogin(){
  setFoot(true);
  app.innerHTML=`<div class="center" style="font-size:4rem;margin-top:20px">🦊</div>
  <h1 class="center">Almas Lernwelt</h1>
  <div class="card">
    <label>Name</label><input class="txt" id="lu" autocomplete="username" autocapitalize="none">
    <label>Passwort</label><input class="txt" id="lp" type="password" inputmode="numeric" autocomplete="current-password">
    <div class="err" id="le"></div>
    <button class="btn wide" id="lb">Los geht's!</button>
  </div>`;
  const go=()=>{ const u=document.getElementById("lu").value.trim().toLowerCase(), p=document.getElementById("lp").value.trim();
    if(u===USER.name && p===USER.pw){ loggedIn=true; try{ localStorage.setItem(KEY+"-login","1"); }catch(e){} showHome(); }
    else document.getElementById("le").textContent="Name oder Passwort stimmt nicht."; };
  document.getElementById("lb").onclick=go;
  document.getElementById("lp").onkeydown=e=>{ if(e.key==="Enter") go(); };
}

function showHome(){
  setFoot(true); S=null; curFach=null;
  app.innerHTML=`<div class="top"><h1>Hallo Alma! 👋</h1><span class="stars">⭐ ${DB.stars}</span></div>
  <p class="muted" style="margin-top:0">Was möchtest du heute üben?</p>
  <div class="grid2">${FAECHER.map(f=>{ const d=fachDone(f), n=f.topics.length;
    return `<button class="tile" style="border-color:${f.color}66" onclick="showFach('${f.id}')"><div class="ic">${f.icon}</div><b>${f.name}</b>
      <small>${d} von ${n} Themen geschafft</small><div class="bar"><i style="width:${Math.round(100*d/n)}%;background:${f.color}"></i></div></button>`; }).join("")}</div>
  <p class="center"><button class="linkbtn" onclick="logout()">Abmelden</button></p>`;
}
function logout(){ loggedIn=false; try{ localStorage.removeItem(KEY+"-login"); }catch(e){} showLogin(); }

function showFach(fid){
  setFoot(true); S=null; curFach=fid; const f=FACH[fid];
  app.innerHTML=`<div class="top"><button class="btn sec" onclick="showHome()">← Fächer</button><span class="stars">⭐ ${DB.stars}</span></div>
  <h1>${f.icon} ${f.name}</h1>${f.info?`<p class="muted" style="margin-top:0">${f.info}</p>`:""}
  <div class="grid2 modes">
    <button class="tile" style="border-color:#ffd2a8" onclick="showTopics('${fid}')"><div class="ic">🗺️</div><b>Thema für Thema</b><small>${fachDone(f)} von ${f.topics.length} Themen geschafft</small></button>
    <button class="tile" style="border-color:#bcd0ff" onclick="startRound('mix:${fid}')"><div class="ic">🎲</div><b>Bunt gemischt</b><small>${ROUND} Aufgaben aus allen Themen</small></button>
  </div>`;
}

function showTopics(fid){
  setFoot(true); curFach=fid; const f=FACH[fid]; const nx=nextTopic(f);
  let h=`<div class="top"><button class="btn sec" onclick="showFach('${fid}')">← Zurück</button><span class="stars">⭐ ${DB.stars}</span></div>
  <h2>${f.icon} ${f.name}: Thema für Thema</h2>
  <p class="muted">Ein Thema ist geschafft, wenn du in einer Runde mindestens ${PASS} von ${ROUND} richtig hast.</p>`;
  if(nx) h+=`<button class="btn wide" style="margin-bottom:14px" onclick="startRound('${nx.id}')">▶ Weiter mit: ${nx.name}</button>`;
  else h+=`<div class="card center"><b>🏆 Alle Themen geschafft!</b><br><span class="muted">Du kannst jedes Thema weiter üben.</span></div>`;
  f.topics.forEach((t,i)=>{ const p=DB.progress[t.id]||{}; const best=p.best||0;
    h+=`<button class="topic ${nx&&nx.id===t.id?"next":""}" onclick="startRound('${t.id}')"><span class="ic">${t.icon}</span>
      <span class="nm">${i+1}. ${t.name}<small>${p.rounds?`Beste Runde: ${best} von ${ROUND}`:"noch nicht geübt"}</small>
      <div class="bar"><i style="width:${best*10}%"></i></div></span><span class="badge">${p.done?"⭐":""}</span></button>`; });
  app.innerHTML=h;
}

function startRound(mode){
  const tasks=[]; let fid;
  if(mode.startsWith("mix:")){ // jedes Thema mind. einmal, Rest zufällig – schwächere Themen häufiger
    fid=mode.slice(4); const tops=FACH[fid].topics;
    const ids=shuffle(tops.map(t=>t.id)).slice(0,Math.min(ROUND,tops.length));
    while(ids.length<ROUND){ const w=tops.map(t=>{ const p=topicPct(t.id); return p===null?1:1+(100-p)/50; }); let x=Math.random()*w.reduce((a,b)=>a+b,0);
      for(let i=0;i<tops.length;i++){ x-=w[i]; if(x<0){ ids.push(tops[i].id); break; } } }
    shuffle(ids).forEach(id=>tasks.push(genTask(id)));
  } else {
    fid=TOPIC_FACH[mode]; const seen=new Set();
    for(let i=0;i<ROUND;i++){ let t, tries=0; do{ t=genTask(mode); tries++; }while(seen.has(t.q+(t.extra||""))&&tries<25); seen.add(t.q+(t.extra||"")); tasks.push(t); }
  }
  curFach=fid;
  S={mode, fid, tasks, i:0, res:[], answered:false};
  showTask();
}
function isMix(){ return S.mode.startsWith("mix:"); }
function progBar(){ return `<div class="prog">${S.tasks.map((_,i)=>`<span class="${i<S.res.length?(S.res[i]?"ok":"bad"):i===S.i?"cur":""}"></span>`).join("")}</div>`; }

function showTask(){
  setFoot(false);
  const t=S.tasks[S.i]; S.input=""; S.place=["","",""]; S.pi=0; S.answered=false;
  const head = isMix()? `🎲 ${FACH[S.fid].name} gemischt` : TOPIC[S.mode].icon+" "+TOPIC[S.mode].name;
  app.innerHTML=`<div class="top"><button class="btn sec" onclick="showFach('${S.fid}')">✕</button><span class="tname">${head}</span><span class="stars">${S.i+1}/${S.tasks.length}</span></div>
  ${progBar()}
  <div class="card">
    ${isMix()?`<div class="tname">${TOPIC[t.topic].icon} ${TOPIC[t.topic].name}</div>`:""}
    <div class="q ${t.small?"small":""}">${t.q}</div>
    ${t.extra?`<div class="fig" id="fig">${t.extra}</div>`:""}
    <div id="ansArea"></div>
    <div id="fb"></div>
  </div>`;
  renderAnswer();
}

/* Antwort-Typen:
   num    – Zahl über Tastenfeld          ans: Zahl
   place  – Stellentafel H/Z/E            ans: [h,z,e]
   cmp    – <, =, >                       ans: "<"|"="|">"
   mc     – Auswahl                       ans: Text, opts:[...], optional labels:{opt:html}, one:true (einspaltig)
   tap    – im Bild (extra) antippen      ans: data-v des richtigen Elements (.tapme)
   custom – eigene Eingabe:  mount(el, submit)  check(given)->bool  (optional showAns, givenText) */
function renderAnswer(){
  const t=S.tasks[S.i], a=document.getElementById("ansArea");
  if(t.type==="num"){
    a.innerHTML=`<div class="answer"><div class="ansfield" id="af">${esc(S.input)}</div></div>${keypad()}`;
  } else if(t.type==="place"){
    a.innerHTML=`<table class="st"><tr><th>H</th><th>Z</th><th>E</th></tr><tr>${[0,1,2].map(i=>`<td class="inp ${i===S.pi?"sel":""}" onclick="selPlace(${i})">${S.place[i]}</td>`).join("")}</tr></table>${keypad()}`;
  } else if(t.type==="cmp"){
    a.innerHTML=`<div class="opts" style="grid-template-columns:1fr 1fr 1fr">${["<","=",">"].map(o=>`<button class="opt big" data-v="${o}">${esc(o)}</button>`).join("")}</div>`;
    a.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b.dataset.v,b));
  } else if(t.type==="mc"){
    a.innerHTML=`<div class="opts ${t.one?"one":""}">${t.opts.map(o=>`<button class="opt" data-v="${esc(o)}">${t.labels&&t.labels[o]!==undefined?t.labels[o]:esc(o)}</button>`).join("")}</div>`;
    a.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b.dataset.v,b));
  } else if(t.type==="tap"){
    const fig=document.getElementById("fig");
    fig.querySelectorAll(".tapme").forEach(el=>el.addEventListener("click",()=>answer(el.dataset.v,el)));
    a.innerHTML=`<p class="center muted">👆 Tippe im Bild auf die richtige Stelle.</p>`;
  } else if(t.type==="custom"){
    a.innerHTML=""; t.mount(a, given=>answer(given));
  }
}
function keypad(){ return `<div class="keypad" id="kp">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" onclick="key('${n}')">${n}</button>`).join("")}
  <button class="key del" onclick="key('del')">⌫</button><button class="key" onclick="key('0')">0</button><button class="key ok" onclick="key('ok')">✓</button></div>`; }
function selPlace(i){ if(S.answered) return; S.pi=i; renderAnswer(); }
function key(k){
  if(S.answered){ if(k==="ok") nextTask(); return; }
  const t=S.tasks[S.i];
  if(t.type==="place"){
    if(k==="del"){ if(S.place[S.pi]==="" && S.pi>0) S.pi--; S.place[S.pi]=""; }
    else if(k==="ok"){ if(S.place.some(x=>x==="")) { flash("Fülle alle drei Felder aus."); return; } answer(S.place.map(Number)); return; }
    else { S.place[S.pi]=k; if(S.pi<2) S.pi++; }
    renderAnswer(); return;
  }
  if(k==="del") S.input=S.input.slice(0,-1);
  else if(k==="ok"){ if(S.input==="") return; answer(Number(S.input)); return; }
  else if(S.input.length<4) S.input+=k;
  document.getElementById("af").textContent=S.input;
}
function flash(msg){ const f=document.getElementById("fb"); f.innerHTML=`<div class="fb bad">${msg}</div>`; setTimeout(()=>{ if(!S.answered) f.innerHTML=""; },1600); }

const PRAISE=["Super! 🎉","Richtig! ⭐","Klasse! 👍","Toll gemacht! 🌟","Genau! 💪","Prima! 😊"];
function answer(v, el){
  if(S.answered) return;
  const t=S.tasks[S.i];
  let ok;
  if(t.type==="place") ok=v.every((x,i)=>x===t.ans[i]);
  else if(t.type==="custom") ok=!!t.check(v);
  else ok=String(v)===String(t.ans);
  S.answered=true; S.res.push(ok);
  const given = Array.isArray(v)&&t.type==="place"? v.join(" | ") : (t.givenText? t.givenText(v) : (t.labels&&t.labels[v]? (String(t.labels[v]).replace(/<[^>]+>/g,"").trim()||v) : v));
  record(t, ok, given);
  if(t.type==="mc"||t.type==="cmp"){ document.querySelectorAll("#ansArea .opt").forEach(b=>{ if(b.dataset.v===String(t.ans)) b.classList.add("right"); }); if(!ok&&el) el.classList.add("wrong"); }
  if(t.type==="tap"){ const fig=document.getElementById("fig");
    fig.querySelectorAll(".tapme").forEach(x=>{ if(x.dataset.v===String(t.ans)) x.classList.add("tap-right"); }); if(!ok&&el) el.classList.add("tap-wrong"); }
  const fb=document.getElementById("fb");
  fb.innerHTML = ok
    ? `<div class="fb ok"><b class="big">${pick(PRAISE)}</b><br>${t.ex||""}</div>`
    : `<div class="fb bad"><b class="big">Nicht ganz.</b>${t.type==="tap"?" Die richtige Stelle ist grün markiert.":` Richtig ist: <b>${ansText(t)}</b>`}<br>${t.ex||""}</div>`;
  fb.insertAdjacentHTML("beforeend",`<button class="btn wide" style="margin-top:12px" onclick="nextTask()">${S.i+1<S.tasks.length?"Weiter →":"Fertig!"}</button>`);
  const kp=document.getElementById("kp"); if(kp) kp.classList.add("hide");
  fb.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function nextTask(){ S.i++; if(S.i>=S.tasks.length) showResult(); else showTask(); }

function showResult(){
  setFoot(true);
  const n=S.res.filter(Boolean).length, f=FACH[S.fid];
  let extra="";
  if(!isMix()){ const p=DB.progress[S.mode] ||= {rounds:0,best:0,done:false}; p.rounds++; p.best=Math.max(p.best,n); const wasDone=p.done; if(n>=PASS) p.done=true; save();
    extra = n>=PASS ? (wasDone?`<p>Das Thema hattest du schon geschafft – stark wiederholt!</p>`:`<p><b>Thema geschafft! ⭐</b></p>`) : `<p>Für das Thema brauchst du ${PASS} von ${ROUND}. Probier's gleich nochmal!</p>`; }
  const emo = n===ROUND?"🏆":n>=PASS?"🎉":n>=5?"👍":"💪";
  const nx=nextTopic(f);
  app.innerHTML=`<div class="card center"><div class="done-emoji">${emo}</div><h2>${n} von ${ROUND} richtig!</h2>${extra}
    <div class="row" style="justify-content:center;margin-top:10px">
      <button class="btn" onclick="startRound('${S.mode}')">Nochmal</button>
      ${!isMix()&&n>=PASS&&nx?`<button class="btn blue" onclick="startRound('${nx.id}')">Nächstes Thema</button>`:""}
      <button class="btn sec" onclick="${isMix()?`showFach('${S.fid}')`:`showTopics('${S.fid}')`}">Übersicht</button>
    </div></div>`;
}

/* ===== Elternbereich ===== */
function back(){ if(!loggedIn) showLogin(); else if(curFach) showFach(curFach); else showHome(); }
function showParentLogin(){
  setFoot(false);
  app.innerHTML=`<div class="top"><button class="btn sec" onclick="back()">← Zurück</button></div>
  <div class="card"><h2>👪 Elternbereich</h2>
  <label>Eltern-Passwort</label><input class="txt" id="pp" type="password" inputmode="numeric">
  <div class="err" id="pe"></div><button class="btn wide" id="pb">Öffnen</button></div>`;
  const go=()=>{ if(document.getElementById("pp").value.trim()===PARENT_PW) showStats(); else document.getElementById("pe").textContent="Falsches Passwort."; };
  document.getElementById("pb").onclick=go; document.getElementById("pp").onkeydown=e=>{ if(e.key==="Enter") go(); };
  document.getElementById("pp").focus();
}
function pctCell(ok,n){ if(!n) return `<span class="muted">–</span>`; const p=Math.round(100*ok/n); const c=p>=80?"g":p>=60?"m":"b"; return `<span class="pct ${c}">${p} %</span>`; }
function errPct(ok,n){ return n? Math.round(100*(n-ok)/n)+" %" : "–"; }
function showStats(){
  setFoot(false);
  let tot=0, tok=0; Object.values(DB.stats).forEach(s=>{ tot+=s.n; tok+=s.ok; });
  let h=`<div class="top"><button class="btn sec" onclick="back()">← Zurück</button><span class="stars">⭐ ${DB.stars}</span></div>
  <div class="card"><h2>📊 Statistik</h2>
  <p>Insgesamt <b>${tot}</b> Aufgaben bearbeitet, davon richtig: ${pctCell(tok,tot)} · Fehler: ${errPct(tok,tot)}</p>
  <p class="muted" style="font-size:.9rem">Grün ab 80 %, gelb ab 60 %, rot darunter. ⭐ = Thema im Thema-Modus geschafft.</p></div>`;
  for(const f of FAECHER){
    let fn=0, fok=0; f.topics.forEach(t=>{ const s=DB.stats[t.id]; if(s){ fn+=s.n; fok+=s.ok; } });
    h+=`<div class="card"><h2>${f.icon} ${f.name}</h2><p style="margin-top:0">${fn} Aufgaben · richtig ${pctCell(fok,fn)} · Fehler ${errPct(fok,fn)}</p>
    <table class="stat"><tr><th>Thema</th><th class="n">Aufg.</th><th class="n">Richtig</th><th class="n">Fehler</th></tr>`;
    f.topics.forEach(t=>{ const s=DB.stats[t.id]||{n:0,ok:0}; const p=DB.progress[t.id]||{};
      h+=`<tr><td>${t.icon} ${t.name}${p.done?" ⭐":""}</td><td class="n">${s.n}</td><td class="n">${pctCell(s.ok,s.n)}</td><td class="n">${errPct(s.ok,s.n)}</td></tr>`; });
    h+=`</table>`;
    const det=f.topics.map(t=>{ const rows=t.gens.map(g=>({g,s:DB.sub[t.id+"|"+g.sub]||{n:0,ok:0}})); if(!rows.some(x=>x.s.n)) return "";
      return `<details><summary>🔍 ${t.icon} ${t.name}</summary><table class="stat">`+rows.map(({g,s})=>`<tr class="sub"><td>${g.label}</td><td class="n">${s.n}</td><td class="n">${pctCell(s.ok,s.n)}</td></tr>`).join("")+`</table></details>`; }).join("");
    if(det) h+=`<p class="muted" style="margin-bottom:0">Genauer nach Aufgabentyp:</p>${det}`;
    h+=`</div>`;
  }
  const days=Object.entries(DB.days).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,10);
  if(days.length){ h+=`<div class="card"><h2>📅 Letzte Übungstage</h2><table class="stat"><tr><th>Datum</th><th class="n">Aufg.</th><th class="n">Richtig</th></tr>`+
    days.map(([d,s])=>`<tr><td>${d.split("-").reverse().join(".")}</td><td class="n">${s.n}</td><td class="n">${pctCell(s.ok,s.n)}</td></tr>`).join("")+`</table></div>`; }
  if(DB.errors.length){ h+=`<div class="card"><h2>❌ Letzte Fehler</h2><ul class="errlist">`+DB.errors.slice(0,15).map(e=>{ const f=FACH[TOPIC_FACH[e.topic]];
    return `<li><b>${esc(e.q)}</b><br><span class="muted">${f?f.icon+" ":""}${esc(TOPIC[e.topic]?TOPIC[e.topic].name:e.topic)} · ${esc(e.sub)} – eingegeben: ${esc(e.given)}, richtig: ${esc(e.correct)}</span></li>`; }).join("")+`</ul></div>`; }
  h+=`<div class="card"><p class="muted" style="font-size:.9rem">Die Daten werden nur auf diesem Gerät gespeichert.</p><button class="btn sec" id="rs">Statistik zurücksetzen</button></div>`;
  app.innerHTML=h;
  const rs=document.getElementById("rs"); let armed=false;
  rs.onclick=()=>{ if(!armed){ armed=true; rs.textContent="Wirklich alles löschen? Nochmal tippen"; rs.style.color="var(--bad)"; return; }
    DB={stats:{},sub:{},errors:[],progress:{},days:{},stars:0}; save(); showStats(); };
}

loggedIn ? showHome() : showLogin();
</script>
