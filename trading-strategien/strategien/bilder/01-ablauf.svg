<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250" role="img" aria-label="Ablauf in vier Schritten">
<title>Ablauf in vier Schritten</title>
<rect x="0" y="0" width="800" height="250" fill="#ffffff"/>
<defs><marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="pfeilg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<text x="30.0" y="32.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2937" font-weight="bold" text-anchor="start">Ablauf der Pullback-Strategie in vier Schritten</text>
<rect x="30" y="60" width="170" height="160" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<circle cx="54" cy="86" r="14" fill="#0f766e"/>
<text x="54.0" y="91.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="76.0" y="91.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="start">Auswählen</text>
<text x="42.0" y="126.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">Top 20–30 % nach</text>
<text x="42.0" y="147.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">1/3/6-Monats-Plus</text>
<text x="42.0" y="168.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">> 30 %, liquide</text>
<text x="42.0" y="189.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">→ Konsolidierung</text>
<line x1="203" y1="140" x2="223" y2="140" stroke="#1f2937" stroke-width="2" marker-end="url(#pfeil)"/>
<rect x="226" y="60" width="170" height="160" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<circle cx="250" cy="86" r="14" fill="#0f766e"/>
<text x="250.0" y="91.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="272.0" y="91.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="start">Zone + Signal</text>
<text x="238.0" y="126.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">EMA 9/21/50, AVWAP,</text>
<text x="238.0" y="147.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">alte Hochs, Gaps</text>
<text x="238.0" y="168.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">→ Minutenchart:</text>
<text x="238.0" y="189.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">Bruch Vorkerzen-Hoch</text>
<line x1="399" y1="140" x2="419" y2="140" stroke="#1f2937" stroke-width="2" marker-end="url(#pfeil)"/>
<rect x="422" y="60" width="170" height="160" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<circle cx="446" cy="86" r="14" fill="#0f766e"/>
<text x="446.0" y="91.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="468.0" y="91.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="start">Risiko festlegen</text>
<text x="434.0" y="126.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">Stop: Tagestief /</text>
<text x="434.0" y="147.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">Signalkerze (≤ 3 %)</text>
<text x="434.0" y="168.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">Risiko 0,5 % Konto</text>
<text x="434.0" y="189.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">→ Stückzahl rechnen</text>
<line x1="595" y1="140" x2="615" y2="140" stroke="#1f2937" stroke-width="2" marker-end="url(#pfeil)"/>
<rect x="618" y="60" width="170" height="160" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
<circle cx="642" cy="86" r="14" fill="#0f766e"/>
<text x="642.0" y="91.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<text x="664.0" y="91.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="start">Gewinne sichern</text>
<text x="630.0" y="126.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">Teilverkauf 3R / 5R</text>
<text x="630.0" y="147.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">Rest am EMA 9</text>
<text x="630.0" y="168.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">nachziehen; bei Über-</text>
<text x="630.0" y="189.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">dehnung reduzieren</text>
</svg>
