<text x="528.0" y="208.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#16a34a" font-weight="bold" text-anchor="start">21,50</text>
<line x1="60" y1="159.5" x2="520" y2="159.5" stroke="#6b7280" stroke-width="1"/>
<text x="52.0" y="163.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" font-weight="bold" text-anchor="end">+4R</text>
<text x="528.0" y="163.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start">22,00</text>
<line x1="60" y1="114.7" x2="520" y2="114.7" stroke="#16a34a" stroke-width="2.2"/>
