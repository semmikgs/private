<text x="260.0" y="182.3" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#16a34a" font-weight="bold" text-anchor="middle">Teil 1</text>
<circle cx="350.0" cy="105.8" r="7" fill="#16a34a"/>
<text x="350.0" y="92.8" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#16a34a" font-weight="bold" text-anchor="middle">Teil 2</text>
<circle cx="500.0" cy="177.4" r="7" fill="none" stroke="#2563eb" stroke-width="2.4"/>
<text x="510.0" y="235.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2563eb" font-weight="bold" text-anchor="end">Rest raus:</text>
<text x="510.0" y="250.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2563eb" font-weight="bold" text-anchor="end">Schluss unter EMA 9</text>
<circle cx="80.0" cy="338.4" r="6" fill="#1f2937"/>
<rect x="632" y="70" width="160" height="240" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="640.0" y="92.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="bold" text-anchor="start">Beispiel (ohne Kosten)</text>
<text x="640.0" y="112.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">Konto: 10.000 $</text>
<text x="640.0" y="132.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">Risiko 0,5 % = 50 $</text>
<text x="640.0" y="152.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">1R = 20,00 − 19,50</text>
<text x="640.0" y="172.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">     = 0,50 $ je Aktie</text>
<text x="640.0" y="192.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">Stückzahl = 50 ÷ 0,50</text>
<text x="640.0" y="212.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">     = 100 Aktien</text>
<text x="640.0" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">Einsatz 2.000 $ (20 %)</text>
<text x="640.0" y="252.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start"></text>
<text x="640.0" y="272.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">+3R = +1,50 $ / Aktie</text>
<text x="640.0" y="292.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">+5R = +2,50 $ / Aktie</text>
<text x="30.0" y="444.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" font-weight="bold" text-anchor="start">Gewinne und Verluste werden in Vielfachen des Anfangsrisikos R gezählt – nicht in Euro oder Prozent.</text>
</svg>
