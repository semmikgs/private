<text x="528.0" y="387.2" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#dc2626" font-weight="bold" text-anchor="start">Stop 19,50</text>
<line x1="60" y1="338.4" x2="520" y2="338.4" stroke="#1f2937" stroke-width="2.2"/>
<text x="52.0" y="342.4" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937" font-weight="bold" text-anchor="end">0R</text>
<text x="528.0" y="342.4" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937" font-weight="bold" text-anchor="start">Einstieg 20,00</text>
