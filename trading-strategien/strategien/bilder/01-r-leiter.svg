<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-label="R-Leiter mit Stop, Teilverkäufen bei 3R und 5R und Nachziehen am EMA 9">
<title>R-Leiter mit Stop, Teilverkäufen bei 3R und 5R und Nachziehen am EMA 9</title>
<rect x="0" y="0" width="800" height="460" fill="#ffffff"/>
<defs><marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><marker id="pfeilg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<text x="30.0" y="32.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1f2937" font-weight="bold" text-anchor="start">Schritte 3 + 4: Risiko in R messen – Stop, Teilverkäufe, Rest nachziehen</text>
<rect x="60" y="338.4" width="460" height="44.7" fill="#fee2e2"/>
<rect x="60" y="114.7" width="460" height="223.7" fill="#dcfce7" opacity="0.6"/>
