<text x="528.0" y="252.9" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start">21,00</text>
<line x1="60" y1="204.2" x2="520" y2="204.2" stroke="#16a34a" stroke-width="2.2"/>
