name: Projektliste aktualisieren
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: projects.json erzeugen
        run: python3 scripts/build_index.py
      - name: Änderungen committen
        run: |
          if git diff --quiet -- projects.json; then echo "Keine Änderung"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add projects.json
          git commit -m "Projektliste automatisch aktualisiert"
          git push
