name: MTV-Daten von nuLiga holen
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/mtv_scrape.py", ".github/workflows/mtv.yml"]
permissions:
  contents: write
concurrency:
  group: mtv-daten
  cancel-in-progress: false
jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: nuLiga auslesen
        run: python3 scripts/mtv_scrape.py
      - name: Änderungen committen
        run: |
          if git diff --quiet -- mtv/daten.json && [ -z "$(git status --porcelain mtv/daten.json)" ]; then echo "Keine Änderung"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add mtv/daten.json
          git commit -m "MTV-Daten aktualisiert"
          git pull --rebase origin main
          git push
