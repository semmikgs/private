<style>

canvas{display:block}

#msg{position:fixed;top:28%;left:50%;transform:translate(-50%,-50%);width:90%;color:#fff;font-size:19px;font-weight:700;text-align:center;text-shadow:0 2px 8px #000;pointer-events:none;z-index:6}
#fog{position:fixed;inset:0;pointer-events:none;z-index:2;width:100%;height:100%}
#map{position:fixed;inset:0;z-index:8;display:none;pointer-events:none;width:100%;height:100%}

#bM{right:30px;bottom:calc(148px + env(safe-area-inset-bottom));width:50px;height:50px;font-size:22px;background:rgba(240,180,50,.7)}
.btn.on{filter:brightness(1.4);transform:scale(.94)}
#speed{position:fixed;right:14px;bottom:calc(212px + env(safe-area-inset-bottom));z-index:5;width:110px}
#keys{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(172px + env(safe-area-inset-bottom));background:rgba(18,20,30,.9);border:1px solid #fff3;border-radius:16px;padding:10px 12px;display:none;z-index:7;color:#fff;text-align:center;font-size:14px}
#keyRow{display:grid;grid-template-columns:repeat(3,auto);gap:6px;margin-top:6px}
.key{background:rgba(255,255,255,.08);border-radius:10px;padding:5px 6px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
.key:active{background:rgba(255,255,255,.25)}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 8px))}75%{transform:translateX(calc(-50% + 8px))}}
#menu{position:fixed;inset:0;background:rgba(10,10,20,.94);color:#fff;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;line-height:1.45;overflow:auto}
#menu h2{margin:.2em 0}#menu p{max-width:470px;font-size:14px;margin:.5em 0}
#menu .lv{display:flex;flex-direction:column;gap:7px;width:100%;max-width:340px;margin-top:10px}
#menu button{font-size:16px;padding:11px 16px;border-radius:12px;border:0;background:#f5b941;font-weight:700;text-align:left}
#menu button:disabled{background:#444;color:#999}

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const V=(x,z)=>new THREE.Vector3(x,0,z);
const wrapA=a=>((a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;
const lerpA=(a,b,k)=>a+wrapA(b-a)*k;

/* ================= Renderer & Licht ================= */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0d0f16);
const cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,200);cam.position.set(14,13,0);
scene.add(new THREE.HemisphereLight(0xfff6e8,0x5a5048,1.7));
const sun=new THREE.DirectionalLight(0xfff1dd,2.3);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20,near:1,far:80});sun.shadow.camera.updateProjectionMatrix();sun.shadow.bias=-.0006;
scene.add(sun,sun.target);
for(const [x,z] of [[-14,0],[0,0],[14,0],[-24,0]]){const l=new THREE.PointLight(0xffe2b0,6,10,1.6);l.position.set(x,2.4,z);scene.add(l);}
const lamp=new THREE.PointLight(0xffd59a,3,6,1.5);scene.add(lamp);

/* ================= Helfer ================= */
const MC={};function mat(c,o={}){const k=c+JSON.stringify(o);return MC[k]||(MC[k]=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85},o)));}
const SOLID=[];let OCC=[];
function addCol(x,z,w,d,extra){const c=Object.assign({x1:x-w/2,x2:x+w/2,z1:z-d/2,z2:z+d/2},extra||{});SOLID.push(c);return c;}
function blocked(x,z,r){for(const w of SOLID){if(w.open)continue;if(x+r>w.x1&&x-r<w.x2&&z+r>w.z1&&z-r<w.z2)return true;}return false;}
function move(o,dx,dz,r=.28){if(!blocked(o.position.x+dx,o.position.z,r))o.position.x+=dx;if(!blocked(o.position.x,o.position.z+dz,r))o.position.z+=dz;}
// Sichtlinie: Abstand bis zum ersten sichtblockierenden Objekt
function rayHit(ox,oz,dx,dz,maxD){let best=maxD;for(const w of OCC){if(w.open)continue;let tmin=0,tmax=best;
 if(Math.abs(dx)<1e-9){if(ox<w.x1||ox>w.x2)continue;}else{let a=(w.x1-ox)/dx,b=(w.x2-ox)/dx;if(a>b)[a,b]=[b,a];if(a>tmin)tmin=a;if(b<tmax)tmax=b;if(tmin>tmax)continue;}
 if(Math.abs(dz)<1e-9){if(oz<w.z1||oz>w.z2)continue;}else{let a=(w.z1-oz)/dz,b=(w.z2-oz)/dz;if(a>b)[a,b]=[b,a];if(a>tmin)tmin=a;if(b<tmax)tmax=b;if(tmin>tmax)continue;}
 if(tmin<best)best=tmin;}return best;}
function box(w,h,d,c,x,y,z,o={}){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),o.m||mat(c,o.mo));m.position.set(x,y,z);if(o.ry)m.rotation.y=o.ry;m.castShadow=o.cast!==false;m.receiveShadow=true;(o.parent||scene).add(m);
 if(o.solid){const sw=o.ry&&Math.abs(Math.sin(o.ry))>.5;addCol(x,z,sw?d:w,sw?w:d,{occ:o.occ!==false});}return m;}
function cyl(rt,rb,h,c,x,y,z,o={}){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,o.seg||14),o.m||mat(c,o.mo));m.position.set(x,y,z);m.castShadow=o.cast!==false;m.receiveShadow=true;(o.parent||scene).add(m);if(o.solid)addCol(x,z,rb*2,rb*2,{occ:o.occ!==false});return m;}
function sph(r,c,x,y,z,o={}){const m=new THREE.Mesh(new THREE.SphereGeometry(r,o.seg||12,o.seg?o.seg-2:10),o.m||mat(c,o.mo));m.position.set(x,y,z);m.castShadow=o.cast!==false;(o.parent||scene).add(m);return m;}
function ctex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}return t;}
function noise(x,w,h,n,a){for(let i=0;i<n;i++){x.fillStyle=`rgba(0,0,0,${Math.random()*a})`;x.fillRect(Math.random()*w,Math.random()*h,2,2);}}

/* Instanzen für viele gleiche Teile */
const INST={};
function defI(k,geo,o={}){const sh=o.shadow!==false;delete o.shadow;INST[k]={geo,mat:new THREE.MeshStandardMaterial(Object.assign({color:0xffffff,roughness:.8},o)),l:[],shadow:sh};}
function I(k,x,y,z,c,ry=0,s=null){INST[k].l.push([x,y,z,c,ry,s]);}
function buildI(){const M=new THREE.Matrix4(),Q=new THREE.Quaternion(),S=new THREE.Vector3(),P=new THREE.Vector3(),C=new THREE.Color(),Y=new THREE.Vector3(0,1,0);
 for(const k in INST){const d=INST[k];if(!d.l.length)continue;const im=new THREE.InstancedMesh(d.geo,d.mat,d.l.length);
  d.l.forEach((e,i)=>{P.set(e[0],e[1],e[2]);Q.setFromAxisAngle(Y,e[4]||0);e[5]?S.set(e[5][0],e[5][1],e[5][2]):S.set(1,1,1);M.compose(P,Q,S);im.setMatrixAt(i,M);im.setColorAt(i,C.set(e[3]));});
  im.castShadow=d.shadow;im.receiveShadow=true;scene.add(im);}}
defI('deskTop',new THREE.BoxGeometry(1.2,.06,.6));defI('deskSide',new THREE.BoxGeometry(.05,.66,.55));
defI('seat',new THREE.BoxGeometry(.42,.05,.4));defI('back',new THREE.BoxGeometry(.42,.4,.05));
defI('locker',new THREE.BoxGeometry(.5,1.3,.4),{roughness:.5,metalness:.2});defI('vent',new THREE.BoxGeometry(.3,.03,.01),{shadow:false});
defI('handle',new THREE.BoxGeometry(.04,.12,.03),{metalness:.6,roughness:.3,shadow:false});defI('book',new THREE.BoxGeometry(.07,.26,.2));
defI('bottle',new THREE.CylinderGeometry(.05,.065,.24,8),{roughness:.4});defI('paper',new THREE.BoxGeometry(.21,.004,.29),{shadow:false});
defI('litter',new THREE.SphereGeometry(.06,6,5),{shadow:false});
defI('stool',new THREE.CylinderGeometry(.17,.15,.45,10));defI('crate',new THREE.BoxGeometry(.5,.35,.4));
defI('post',new THREE.BoxGeometry(.06,.9,.06));defI('rail',new THREE.BoxGeometry(1,.05,.04),{shadow:false});
defI('line',new THREE.BoxGeometry(.08,.005,3.2),{shadow:false});

/* ================= Texturen ================= */
const FLOOR={
 tiles:[2,(x,w,h)=>{for(let i=0;i<2;i++)for(let j=0;j<2;j++){x.fillStyle=(i+j)%2?'#cbc3ae':'#b5ad98';x.fillRect(i*64,j*64,64,64);}x.strokeStyle='#8f887a';x.lineWidth=2;for(let i=0;i<=2;i++){x.beginPath();x.moveTo(i*64,0);x.lineTo(i*64,128);x.moveTo(0,i*64);x.lineTo(128,i*64);x.stroke();}noise(x,w,h,500,.09);}],
 stone:[3,(x,w,h)=>{x.fillStyle='#d9d6cf';x.fillRect(0,0,w,h);x.fillStyle='#c7c2b8';x.fillRect(0,0,64,64);x.fillRect(64,64,64,64);x.strokeStyle='#a9a398';x.lineWidth=2;x.strokeRect(0,0,128,128);x.beginPath();x.moveTo(64,0);x.lineTo(64,128);x.moveTo(0,64);x.lineTo(128,64);x.stroke();noise(x,w,h,700,.08);}],
 wood:[2.4,(x,w,h)=>{for(let r=0;r<8;r++){const off=(r%2)*48;for(let c=-1;c<2;c++){x.fillStyle=`hsl(${30+Math.random()*6},${38+Math.random()*10}%,${52+Math.random()*10}%)`;x.fillRect(off+c*96,r*16,96,16);x.fillStyle='rgba(60,35,15,.5)';x.fillRect(off+c*96,r*16,1.5,16);}x.fillStyle='rgba(60,35,15,.45)';x.fillRect(0,r*16,128,1.2);}for(let i=0;i<60;i++){x.strokeStyle='rgba(80,50,20,.12)';x.beginPath();const y=Math.random()*128;x.moveTo(0,y);x.bezierCurveTo(40,y+3,80,y-3,128,y);x.stroke();}}],
 wood2:[2.4,(x,w,h)=>{for(let r=0;r<8;r++){for(let c=-1;c<2;c++){x.fillStyle=`hsl(${22+Math.random()*6},45%,${38+Math.random()*8}%)`;x.fillRect((r%2)*48+c*96,r*16,96,16);}x.fillStyle='rgba(30,15,5,.5)';x.fillRect(0,r*16,128,1.2);}noise(x,w,h,300,.1);}],
 carpet:[2,(x,w,h)=>{x.fillStyle='#4f5f80';x.fillRect(0,0,w,h);for(let i=0;i<3000;i++){x.fillStyle=Math.random()<.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.08)';x.fillRect(Math.random()*w,Math.random()*h,1.5,1.5);}}],
 carpet2:[2,(x,w,h)=>{x.fillStyle='#7a6a8c';x.fillRect(0,0,w,h);for(let i=0;i<3000;i++){x.fillStyle=Math.random()<.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.08)';x.fillRect(Math.random()*w,Math.random()*h,1.5,1.5);}}],
 tile2:[1,(x,w,h)=>{x.fillStyle='#9a9d9f';x.fillRect(0,0,w,h);x.strokeStyle='#6f7376';x.lineWidth=3;x.strokeRect(0,0,w,h);noise(x,w,h,400,.12);}],
 wc:[.8,(x,w,h)=>{for(let i=0;i<4;i++)for(let j=0;j<4;j++){x.fillStyle=(i+j)%2?'#e9f3f2':'#cfe3e1';x.fillRect(i*32,j*32,32,32);}x.strokeStyle='#9bb';x.lineWidth=1.5;for(let i=0;i<=4;i++){x.beginPath();x.moveTo(i*32,0);x.lineTo(i*32,128);x.moveTo(0,i*32);x.lineTo(128,i*32);x.stroke();}}],
 asphalt:[3,(x,w,h)=>{x.fillStyle='#7c7d7a';x.fillRect(0,0,w,h);for(let i=0;i<2500;i++){x.fillStyle=Math.random()<.5?'rgba(255,255,255,.07)':'rgba(0,0,0,.12)';x.fillRect(Math.random()*w,Math.random()*h,1.6,1.6);}}],
 asphalt2:[3,(x,w,h)=>{x.fillStyle='#5f605d';x.fillRect(0,0,w,h);for(let i=0;i<2500;i++){x.fillStyle=Math.random()<.5?'rgba(255,255,255,.06)':'rgba(0,0,0,.12)';x.fillRect(Math.random()*w,Math.random()*h,1.6,1.6);}}],
 grass:[3,(x,w,h)=>{x.fillStyle='#4f8a3e';x.fillRect(0,0,w,h);for(let i=0;i<2500;i++){x.fillStyle=Math.random()<.5?'rgba(160,220,90,.18)':'rgba(0,40,0,.15)';x.fillRect(Math.random()*w,Math.random()*h,1.5,3);}}],
};
function floor(x1,x2,z1,z2,kind,y=0){const [u,draw]=FLOOR[kind],w=x2-x1,h=z2-z1;const t=ctex(128,128,draw,[w/u,h/u]);
 const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({map:t,roughness:kind==='tiles'||kind==='wc'||kind==='stone'?.45:.9}));m.rotation.x=-Math.PI/2;m.position.set((x1+x2)/2,y,(z1+z2)/2);m.receiveShadow=true;scene.add(m);}
function labelTex(text,bg,fg){return ctex(512,128,(c)=>{c.fillStyle=bg;c.beginPath();c.roundRect(4,4,504,120,28);c.fill();c.fillStyle=fg;c.font='bold 56px system-ui,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(text,256,68);});}
function label(text,x,z,w=1.8,bg='rgba(25,30,45,.85)',fg='#fff',ry=0){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,w/4),new THREE.MeshBasicMaterial({map:labelTex(text,bg,fg),transparent:true,depthWrite:false}));m.rotation.set(-Math.PI/2,0,ry);m.position.set(x,.016,z);scene.add(m);return m;}
function boardTex(lines){return ctex(512,180,(c,w,h)=>{c.fillStyle='#2e5a3c';c.fillRect(0,0,w,h);for(let i=0;i<40;i++){c.fillStyle='rgba(255,255,255,.03)';c.fillRect(Math.random()*w,Math.random()*h,60,20);}
 c.fillStyle='rgba(255,255,255,.85)';c.font='30px "Comic Sans MS",cursive';lines.forEach((l,i)=>c.fillText(l,24,48+i*42));c.strokeStyle='rgba(255,255,255,.6)';c.lineWidth=3;c.beginPath();c.arc(430,110,32,0,Math.PI*1.7);c.stroke();});}
const GREEN_BOARD=mat(0x2e5a3c);

/* ================= Gebäude ================= */
const ROOMS=[
 {id:'lz',n:'Lehrerzimmer',ic:'☕',x1:-20,x2:-10,s:-1,door:-13,floor:'wood2'},
 {id:'k6',n:'Klasse 6b',ic:'6b',x1:-10,x2:-2,s:-1,door:-6,floor:'wood',board:['Bruchrechnung','3/4 + 1/8 = ?']},
 {id:'putz',n:'Putzraum',ic:'🧹',x1:-2,x2:2,s:-1,door:0,floor:'tile2',lock:3},
 {id:'k7',n:'Klasse 7c',ic:'7c',x1:2,x2:10,s:-1,door:6,floor:'wood',board:['Ohmsches Gesetz','U = R · I']},
 {id:'sl',n:'Schulleitung',ic:'🪑',x1:10,x2:20,s:-1,door:13,floor:'carpet'},
 {id:'k8',n:'Klasse 8a',ic:'8a',x1:-20,x2:-12,s:1,door:-16,floor:'wood',board:['HA: S. 42 Nr. 3','a² + b² = c²']},
 {id:'samm',n:'Sammlung',ic:'🔬',x1:-12,x2:-8,s:1,door:-10,floor:'tile2',lock:1},
 {id:'ph',n:'Pausenhalle',ic:'🏓',x1:-8,x2:2,s:1,door:-3,floor:'tiles'},
 {id:'wc',n:'WC',ic:'🚽',x1:2,x2:6,s:1,door:4,floor:'wc',lock:2},
 {id:'k9',n:'Klasse 9b',ic:'9b',x1:6,x2:20,s:1,door:13,floor:'wood',board:['Klassenarbeit','am Freitag!!!']},
 {id:'hm',n:'Hausmeister',ic:'🔧',x1:-28,x2:-20,z1:6,z2:13,s:1,door:-24,dz:6,floor:'tile2',lock:5},
];
ROOMS.forEach(r=>{r.dz=r.dz||2;if(r.z1===undefined){r.z1=r.s<0?-13:2;r.z2=r.s<0?-2:13;}r.cx=(r.x1+r.x2)/2;r.cz=(r.z1+r.z2)/2;});
const LOCKED=ROOMS.filter(r=>r.lock!==undefined),PUBLIC=ROOMS.filter(r=>r.lock===undefined);
const roomAt=(x,z)=>ROOMS.find(r=>x>r.x1&&x<r.x2&&z>r.z1&&z<r.z2)||null;
function areaOf(x,z){const r=roomAt(x,z);if(r)return r.id;if(x>-20&&Math.abs(z)<2.2)return 'cor';if(x>-28&&x<=-20&&Math.abs(z)<6)return 'foy';if(x<=-28)return 'yard';return null;}

// Böden
floor(-62,32,-24,24,'grass',-.02);
floor(-20,20,-2,2,'tiles');ROOMS.forEach(r=>floor(r.x1,r.x2,r.z1,r.z2,r.floor));
floor(-28,-20,-6,6,'stone');floor(-28,-20,-13,-6,'carpet2');
floor(-46,-28,-13,13,'asphalt',-.005);floor(-46,-37,-13,-3,'asphalt2',0);
floor(-46,-41,4,13,'grass',.004);floor(-36,-31,-13,-9,'grass',.004);

// Wände
const WALL=mat(0xe9e3d5),CAP=mat(0x8d8578),SKIRT=mat(0x6b5f52);
function wall(x,z,w,d){box(w,1.6,d,0,x,.8,z,{m:WALL,solid:true});box(w+.02,.05,d+.02,0,x,1.625,z,{m:CAP,cast:false});box(w+.04,.14,d+.04,0,x,.07,z,{m:SKIRT,cast:false});}
wall(-4,-13,48.3,.3);wall(-4,13,48.3,.3);wall(20,0,.3,26.3);
wall(-28,-7.1,.3,11.8);wall(-28,7.1,.3,11.8);           // Außenwand West mit Haupteingang
wall(-20,-7.5,.3,11);wall(-20,7.5,.3,11);              // Flur öffnet sich zum Foyer
wall(-27,-6,2,.3);wall(-21,-6,2,.3);                   // Foyer-Nordwand mit Sekretariatsfenster
wall(-26.4,6,3.2,.3);wall(-21.6,6,3.2,.3);              // Foyer-Südwand mit Hausmeistertür
for(const s of [-1,1]){const ds=ROOMS.filter(r=>r.s===s&&r.dz===2).map(r=>r.door).sort((a,b)=>a-b);let cur=-20;
