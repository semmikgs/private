const MC={};function mat(c,o={}){const k=c+JSON.stringify(o);return MC[k]||(MC[k]=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85},o)));}

 if(tmin<best)best=tmin;}return best;}
function box(w,h,d,c,x,y,z,o={}){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),o.m||mat(c,o.mo));m.position.set(x,y,z);if(o.ry)m.rotation.y=o.ry;m.castShadow=o.cast!==false;m.receiveShadow=true;(o.parent||scene).add(m);

const INST={};
function defI(k,geo,o={}){const sh=o.shadow!==false;delete o.shadow;INST[k]={geo,mat:new THREE.MeshStandardMaterial(Object.assign({color:0xffffff,roughness:.8},o)),l:[],shadow:sh};}

  d.l.forEach((e,i)=>{P.set(e[0],e[1],e[2]);Q.setFromAxisAngle(Y,e[4]||0);e[5]?S.set(e[5][0],e[5][1],e[5][2]):S.set(1,1,1);M.compose(P,Q,S);im.setMatrixAt(i,M);im.setColorAt(i,C.set(e[3]));});
  im.castShadow=d.shadow;im.receiveShadow=true;scene.add(im);}}
defI('deskTop',new THREE.BoxGeometry(1.2,.06,.6));defI('deskSide',new THREE.BoxGeometry(.05,.66,.55));

const FLOOR={
 tiles:[2,(x,w,h)=>{for(let i=0;i<2;i++)for(let j=0;j<2;j++){x.fillStyle=(i+j)%2?'#cbc3ae':'#b5ad98';x.fillRect(i*64,j*64,64,64);}x.strokeStyle='#8f887a';x.lineWidth=2;for(let i=0;i<=2;i++){x.beginPath();x.moveTo(i*64,0);x.lineTo(i*64,128);x.moveTo(0,i*64);x.lineTo(128,i*64);x.stroke();}noise(x,w,h,500,.09);}],
